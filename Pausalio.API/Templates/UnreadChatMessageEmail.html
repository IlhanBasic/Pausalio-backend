<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova poruka na platformi Paušalio</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f7fb; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f5f7fb; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(15, 23, 42, 0.08);">
                    <tr>
                        <td style="padding:24px 32px 12px; background:#0f172a; color:#ffffff; font-size:24px; font-weight:700; text-align:center;">
                            Paušalio
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px 32px 8px; font-size:29px; line-height:1.3; font-weight:700; color:#0f172a;">
                            Nova nepročitana poruka
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 24px; font-size:16px; line-height:1.7; color:#334155;">
                            Imate novu nepročitanu poruku od <strong>{{SenderName}}</strong> na platformi Paušalio.
                            <br /><br />
                            Prijavite se u aplikaciju kako biste je pregledali i odgovorili.
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px; text-align:center;">
                            <a href="{{AppUrl}}" style="display:inline-block; background:#2563eb; color:#ffffff; text-decoration:none; padding:14px 24px; border-radius:10px; font-weight:700;">
                                Otvori aplikaciju
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px 28px; font-size:13px; color:#64748b; text-align:center; border-top:1px solid #e2e8f0;">
                            Paušalio · Vaša komunikacija u jednom mestu
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
